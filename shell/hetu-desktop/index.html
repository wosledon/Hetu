<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hetu</title>
    <style>
      /* 首屏固定浅色：不跟随应用的暗色主题，保证水墨图标与品牌信息的可读性 */
      :root {
        color-scheme: light;
        --bg: #f8f9fb;
        --fg: #111827;
        --fg-dim: #6b7280;
        --accent: #3b82f6;
        --track: rgba(17, 24, 39, 0.1);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        animation: fadeIn 0.45s ease-out both;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .logo {
        width: 128px;
        height: 128px;
        object-fit: contain;
        animation: breathe 3.2s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.965); opacity: 0.9; }
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 6px;
        padding-left: 6px;
        color: var(--fg);
      }
      .progress {
        width: 180px;
        height: 2px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
        position: relative;
      }
      .progress::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        transform: translateX(-100%);
        animation: glide 1.4s ease-in-out infinite;
      }
      @keyframes glide {
        to { transform: translateX(100%); }
      }
      .progress.done::after {
        animation: none;
        background: var(--accent);
        transform: none;
      }
      .status {
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--fg-dim);
        min-height: 18px;
      }
      .status.error {
        color: #ef4444;
        white-space: pre-line;
        max-width: 520px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img class="logo" src="./brand.png" alt="Hetu" />
      <div class="title">HETU</div>
      <div class="progress" id="progress"></div>
      <div class="status" id="status">正在启动后端服务…</div>
    </div>
    <script type="module">
      const status = document.getElementById('status');
      const progress = document.getElementById('progress');

      async function bind() {
        try {
          const { listen } = await import('@tauri-apps/api/event');
          await listen('backend-ready', () => {
            status.textContent = '就绪，正在加载界面…';
            if (progress) progress.classList.add('done');
          });
          await listen('backend-error', (evt) => {
            if (progress) progress.style.display = 'none';
            status.classList.add('error');
            status.textContent = '启动失败：\n' + (evt.payload ?? '未知错误');
          });
        } catch (err) {
          console.warn('event listen failed:', err);
        }
      }
      bind();
    </script>
  </body>
</html>
