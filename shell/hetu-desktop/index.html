<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hetu</title>
    <style>
      /*
        首屏明暗跟随应用设置：主题存在 localStorage 的 zustand store（hetu-ui）里，
        在 React 启动前同步读一次并加上 .dark，避免暗色主题用户先看到一帧白底。
      */
      :root {
        color-scheme: light;
        --bg: #f8f9fb;
        --track: rgba(17, 24, 39, 0.08);
      }
      :root.dark {
        color-scheme: dark;
        --bg: #0c0f1a;
        --track: rgba(255, 255, 255, 0.12);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        transition: background 0.3s ease;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        animation: fadeIn 0.45s ease-out both;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      /* 逐笔绘制由 SVG 自身承担（只播放一次），这里只定尺寸 */
      .logo {
        width: 240px;
        height: 240px;
        object-fit: contain;
      }
      /* 加载动画：品牌渐变光段在轨道上横向往返（不定量、只表示进行中） */
      .loader {
        position: relative;
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .loader > i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 72px;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          rgba(124, 92, 255, 0),
          #7c5cff 35%,
          #4f7cff 65%,
          rgba(15, 181, 214, 0)
        );
        animation: glide 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      @keyframes glide {
        from { transform: translateX(-72px); }
        to { transform: translateX(180px); }
      }
      /* 启动失败才展示：默认隐藏，由 backend-error 事件点亮 */
      .status {
        position: fixed;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        display: none;
        max-width: 560px;
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: 1px;
        text-align: center;
        white-space: pre-line;
        color: #6b7280;
      }
      .status.error {
        display: block;
        color: #ef4444;
      }
      :root.dark .status {
        color: #9ca3af;
      }
    </style>
    <script>
      /*
        首屏明暗跟随应用设置。启动屏与应用页面不同 origin，读不到应用自己的
        localStorage，所以主题由应用通过 set_ui_theme 写进数据目录，这里先按
        系统偏好定色（避免等待期间的空白），再向壳请求持久化的主题覆盖。
      */
      ;(function () {
        var root = document.documentElement
        var mq = window.matchMedia('(prefers-color-scheme: dark)')

        function apply(theme) {
          var dark =
            theme === 'dark' ||
            ((theme === 'system' || !theme) && mq.matches)
          root.classList.toggle('dark', dark)
        }

        apply(null)

        // 同 origin 时（开发期壳直接加载前端）仍可读到应用 store
        try {
          var raw = JSON.parse(localStorage.getItem('hetu-ui') || '{}')
          var local = raw && raw.state && raw.state.theme
          if (local) apply(local)
        } catch (e) {
          /* 读不到就按系统偏好 */
        }

        // 壳侧持久化的主题（应用设置里保存的那份）
        import('@tauri-apps/api/core')
          .then(function (mod) {
            return mod.invoke('get_ui_theme')
          })
          .then(function (theme) {
            if (theme) apply(theme)
          })
          .catch(function () {
            /* 壳未就绪时保持系统偏好 */
          })
      })()
    </script>
  </head>
  <body>
    <div class="splash">
      <img class="logo" src="./brand-animated.svg" alt="Hetu" />
      <div class="loader"><i></i></div>
    </div>
    <div class="status" id="status"></div>
    <script type="module">
      const status = document.getElementById('status');

      async function bind() {
        try {
          const { listen } = await import('@tauri-apps/api/event');
          // 后端就绪即整窗导航进应用，首屏不留文字；仅启动失败时展示原因
          await listen('backend-error', (evt) => {
            status.classList.add('error');
            status.textContent = '启动失败：\n' + (evt.payload ?? '未知错误');
          });
        } catch (err) {
          console.warn('event listen failed:', err);
        }
      }
      bind();
    </script>
  </body>
</html>
