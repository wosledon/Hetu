<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Hetu loading" shape-rendering="geometricPrecision">
  <title>Hetu — 首屏加载动画（彩色图标）</title>
  <!--
    与单色版同一套笔画时序，额外让底板「浮起」并加入光晕呼吸与星芒。
    时间轴 3.4s 循环：底板浮起 → 逐笔显现 → 停留呼吸 → 整体淡出。
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1F55"/>
      <stop offset="0.55" stop-color="#161232"/>
      <stop offset="1" stop-color="#0A0B16"/>
    </linearGradient>

    <radialGradient id="aura" cx="0.28" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#8B5CFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5B3CE0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5B3CE0" stop-opacity="0"/>
    </radialGradient>

    <!-- 用 userSpaceOnUse：H 的两条竖画与横画包围盒有一边为 0，
         objectBoundingBox 渐变会让零面积元素直接不渲染。顺带让渐变在
         整个连写上连续，而不是每笔各来一遍。 -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse"
                    x1="110" y1="130" x2="400" y2="380">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#8B9BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16"
                    flood-color="#05060C" flood-opacity="0.55"/>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      /* 底板浮起 */
      .plate{ transform-box:view-box; transform-origin:256px 256px;
        animation:plateIn 3.4s cubic-bezier(.22,.61,.36,1) infinite; }

      .s{ fill:none; stroke:url(#ink); stroke-width:30;
        stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray:100; stroke-dashoffset:100;
        animation-duration:3.4s; animation-iteration-count:infinite;
        animation-timing-function:cubic-bezier(.22,.61,.36,1); }
      .glow{ fill:none; stroke:url(#ink); stroke-width:30;
        stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray:100; stroke-dashoffset:100;
        animation-duration:3.4s; animation-iteration-count:infinite;
        animation-timing-function:cubic-bezier(.22,.61,.36,1); }

      .p1{animation-name:stem1} .p2{animation-name:stem2}
      .p3{animation-name:bar}  .p4{animation-name:tee}
      .halo{ animation:breathe 3.4s ease-in-out infinite; }

      .spark{ transform-box:fill-box; transform-origin:center;
        animation:pop 3.4s cubic-bezier(.34,1.56,.64,1) infinite; }
      .spark2{ opacity:0; transform-box:fill-box; transform-origin:center;
        animation:pop2 3.4s cubic-bezier(.34,1.56,.64,1) infinite; }

      @keyframes plateIn{
        0%{opacity:0;transform:scale(.92)}
        7%{opacity:1;transform:scale(1)}
        88%{opacity:1;transform:scale(1)}
        100%{opacity:0;transform:scale(1.015)}}

      @keyframes stem1{
        0%{stroke-dashoffset:100;opacity:0}  4%{stroke-dashoffset:100;opacity:1}
        19%{stroke-dashoffset:0;opacity:1}   84%{stroke-dashoffset:0;opacity:1}
        100%{stroke-dashoffset:0;opacity:0}}
      @keyframes stem2{
        0%{stroke-dashoffset:100;opacity:0}  10%{stroke-dashoffset:100;opacity:1}
        25%{stroke-dashoffset:0;opacity:1}   84%{stroke-dashoffset:0;opacity:1}
        100%{stroke-dashoffset:0;opacity:0}}
      @keyframes bar{
        0%{stroke-dashoffset:100;opacity:0}  18%{stroke-dashoffset:100;opacity:1}
        32%{stroke-dashoffset:0;opacity:1}   84%{stroke-dashoffset:0;opacity:1}
        100%{stroke-dashoffset:0;opacity:0}}
      @keyframes tee{
        0%{stroke-dashoffset:100;opacity:0}  25%{stroke-dashoffset:100;opacity:1}
        46%{stroke-dashoffset:0;opacity:1}   84%{stroke-dashoffset:0;opacity:1}
        100%{stroke-dashoffset:0;opacity:0}}

      @keyframes breathe{
        0%,44%{opacity:0} 60%{opacity:.45} 70%{opacity:.2} 78%{opacity:.45}
        86%,100%{opacity:0}}

      @keyframes pop{
        0%,43%{opacity:0;transform:scale(0) rotate(-24deg)}
        50%{opacity:1;transform:scale(1.28) rotate(7deg)}
        57%{opacity:1;transform:scale(1) rotate(0)}
        72%{opacity:.5;transform:scale(.94)}
        79%{opacity:.95;transform:scale(1.1)}
        86%,100%{opacity:0;transform:scale(1)}}

      @keyframes pop2{
        0%,43%{opacity:0;transform:scale(.2)}
        52%{opacity:.5;transform:scale(1.5)}
        62%{opacity:0;transform:scale(1.9)}
        100%{opacity:0;transform:scale(1.9)}}
    </style>
  </defs>

  <!-- 底板 -->
  <g class="plate">
    <rect x="16" y="16" width="480" height="480" rx="114"
          fill="url(#plate)" filter="url(#shadow)"/>
    <rect x="16" y="16" width="480" height="480" rx="114" fill="url(#aura)"/>
    <rect x="17" y="17" width="478" height="478" rx="113" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
    <rect x="16" y="16" width="480" height="240" rx="114" fill="url(#gloss)"/>
  </g>

  <!-- 光晕层：笔画绘制完成后淡入并呼吸 -->
  <g class="halo" filter="url(#soft)" opacity="0">
    <path class="glow p1" pathLength="100" d="M111 185 V 379"/>
    <path class="glow p2" pathLength="100" d="M253 185 V 379"/>
    <path class="glow p3" pathLength="100" d="M111 279 H 401"/>
    <path class="glow p4" pathLength="100" d="M321 133 V 347 Q 321 379 353 379 H 377"/>
  </g>

  <!-- 主体笔画 -->
  <g>
    <path class="s p1" pathLength="100" d="M111 185 V 379"/>
    <path class="s p2" pathLength="100" d="M253 185 V 379"/>
    <path class="s p3" pathLength="100" d="M111 279 H 401"/>
    <path class="s p4" pathLength="100" d="M321 133 V 347 Q 321 379 353 379 H 377"/>
  </g>

  <!-- 星芒 -->
  <g transform="translate(388 168)">
    <path class="spark2" fill="#67E8F9"
          d="M0 -26 Q 5.2 5.2 26 0 Q 5.2 -5.2 0 26 Q -5.2 -5.2 -26 0 Q -5.2 5.2 0 -26 Z"/>
    <path class="spark" fill="#67E8F9"
          d="M0 -13 Q 2.6 2.6 13 0 Q 2.6 -2.6 0 13 Q -2.6 -2.6 -13 0 Q -2.6 2.6 0 -13 Z"/>
  </g>
</svg>