name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 带 .NET 运行时（SelfContained / fat）
          - { os: windows-latest, rid: win-x64,   mode: SelfContained,       channel: fat,  label: windows-fat  }
          - { os: ubuntu-latest,  rid: linux-x64, mode: SelfContained,       channel: fat,  label: linux-fat    }
          # 不带 .NET 运行时（FrameworkDependent / slim）
          - { os: windows-latest, rid: win-x64,   mode: FrameworkDependent,  channel: slim, label: windows-slim }
          - { os: ubuntu-latest,  rid: linux-x64, mode: FrameworkDependent,  channel: slim, label: linux-slim   }

    env:
      TAURI_CHANNEL: ${{ matrix.channel }}
      # 更新包签名：私钥与口令放在仓库 Secrets（缺失时构建仍可完成，但不会生成 .sig）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # CI 里增量编译只会撑大缓存、拖慢构建
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shell/hetu-desktop/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/hetu-desktop/src-tauri
          cache-on-failure: true
          # fat / slim 共用同一份缓存：两者的 Rust 依赖完全相同，只有打包配置不同
          shared-key: tauri-${{ runner.os }}

      # Linux：一次性装齐 sqlite-vec 编译与 Tauri 所需依赖，避免反复 apt-get update
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip gettext \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # ---------- 后端 sidecar（含前端 SPA，由 csproj Release 目标自动构建） ----------
      - name: Publish backend sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish-backend.ps1 -Mode ${{ matrix.mode }} -Rid ${{ matrix.rid }}

      - name: Publish backend sidecar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ matrix.mode }}"; RID="${{ matrix.rid }}"
          SC="false"; [ "$MODE" = "SelfContained" ] && SC="true"
          OUT="artifacts/publish/$MODE-$RID"
          rm -rf "$OUT"
          # slim 也单文件打包（含托管 dll），仅不含 .NET 运行时；原生库自解压
          dotnet publish src/Hetu.Api/Hetu.Api.csproj -c Release -r "$RID" \
            --self-contained="$SC" -o "$OUT" /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true
          mkdir -p shell/hetu-desktop/src-tauri/binaries
          cp "$OUT/Hetu.Api" "shell/hetu-desktop/src-tauri/binaries/Hetu.Api-x86_64-unknown-linux-gnu"
          chmod +x "shell/hetu-desktop/src-tauri/binaries/Hetu.Api-x86_64-unknown-linux-gnu"
          rm -rf shell/hetu-desktop/src-tauri/binaries/wwwroot
          cp -r "$OUT/wwwroot" shell/hetu-desktop/src-tauri/binaries/wwwroot

      - name: Build sqlite-vec (Linux native)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          git clone --depth 1 https://github.com/asg017/sqlite-vec.git "$TMP/sqlite-vec"
          cd "$TMP/sqlite-vec"
          ./scripts/vendor.sh
          make loadable
          mkdir -p "$GITHUB_WORKSPACE/shell/hetu-desktop/src-tauri/binaries/sqlite-vec"
          cp dist/vec0.so "$GITHUB_WORKSPACE/shell/hetu-desktop/src-tauri/binaries/sqlite-vec/vec0.so"
          ls -la "$GITHUB_WORKSPACE/shell/hetu-desktop/src-tauri/binaries/sqlite-vec"

      # ---------- 桌面前端 & Tauri 打包 ----------
      - name: Install desktop deps
        working-directory: shell/hetu-desktop
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Tauri build
        working-directory: shell/hetu-desktop
        run: npx tauri build --config src-tauri/tauri.${{ matrix.channel }}.conf.json

      # ---------- 收集产物 ----------
      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hetu-${{ matrix.label }}
          path: |
            shell/hetu-desktop/src-tauri/target/release/bundle/nsis/*.exe
            shell/hetu-desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            shell/hetu-desktop/src-tauri/target/release/bundle/msi/*.msi
            shell/hetu-desktop/src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: ignore

      - name: Upload Linux bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hetu-${{ matrix.label }}
          path: |
            shell/hetu-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            shell/hetu-desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            shell/hetu-desktop/src-tauri/target/release/bundle/deb/*.deb
            shell/hetu-desktop/src-tauri/target/release/bundle/deb/*.deb.sig
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 自动生成提交记录需要完整 tag 与历史
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release 说明：优先使用 release-notes/<tag>.md（人工整理，UTF-8）；
      # 没有时按上一个 tag 的提交历史自动生成——直接推 main 的提交也能显示。
      - name: Prepare release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ -f "release-notes/${tag}.md" ]; then
            cp "release-notes/${tag}.md" notes.md
          else
            prev=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -n1 || true)
            {
              echo "## Hetu ${tag}"
              echo
              echo "### Changes"
              if [ -n "${prev}" ]; then
                git log "${prev}..${tag}" --no-merges --pretty=format:'- %s (%h)'
              else
                git log -n 50 --no-merges --pretty=format:'- %s (%h)'
              fi
              echo
              echo
              if [ -n "${prev}" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
              fi
            } > notes.md
          fi
          # 统一 UTF-8 无 BOM，避免更新清单里出现乱码
          iconv -f UTF-8 -t UTF-8 notes.md > notes.utf8
          mv notes.utf8 notes.md
          head -n 25 notes.md

      - name: Generate updater manifests
        run: |
          node shell/hetu-desktop/scripts/make-latest-json.mjs \
            --dir dist \
            --version "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes-file notes.md
          ls -1 dist | grep -E '^latest' || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/**
